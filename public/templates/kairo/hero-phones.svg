<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 568" fill="none" width="650" height="568">
  <defs>
    <filter id="kairoShadowLg" x="-40" y="-40" width="730" height="648" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#0C0407" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="kairoBlueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#2B84FF"/>
    </linearGradient>
    <linearGradient id="kairoGlow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F7F7F8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Subtle radial halo behind phones -->
  <circle cx="340" cy="260" r="220" fill="url(#kairoGlow)"/>

  <!-- Back/Right tilted device (Secondary screen) -->
  <g transform="translate(320 68) rotate(12)" filter="url(#kairoShadowLg)">
    <rect x="0" y="0" width="236" height="456" rx="34" fill="#141418"/>
    <rect x="7" y="7" width="222" height="442" rx="28" fill="#FFFFFF"/>
    <rect x="78" y="14" width="80" height="18" rx="9" fill="#0C0407"/>
    <!-- Status & Title -->
    <text x="24" y="54" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0C0407">Saved Roles</text>
    <text x="180" y="54" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0066FF">24 Active</text>
    <!-- Role Card A -->
    <rect x="20" y="72" width="196" height="96" rx="14" fill="#F7F7F8" stroke="#EAEAEA"/>
    <rect x="32" y="84" width="28" height="28" rx="8" fill="#0066FF"/>
    <circle cx="46" cy="98" r="6" fill="#FFFFFF"/>
    <text x="70" y="96" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0C0407">Product Designer</text>
    <text x="70" y="110" font-family="Inter, sans-serif" font-size="9.5" fill="#666666">NovaStack · Austin</text>
    <text x="32" y="136" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0066FF">$14,000 – $21,000 /mo</text>
    <rect x="32" y="146" width="46" height="14" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="55" y="156" text-anchor="middle" font-family="Inter, sans-serif" font-size="7.5" fill="#4C4C4C">Full Time</text>
    <rect x="84" y="146" width="46" height="14" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="107" y="156" text-anchor="middle" font-family="Inter, sans-serif" font-size="7.5" fill="#4C4C4C">Remote</text>
    <!-- Role Card B -->
    <rect x="20" y="180" width="196" height="96" rx="14" fill="#FFFFFF" stroke="#EAEAEA"/>
    <rect x="32" y="192" width="28" height="28" rx="8" fill="#16A34A"/>
    <path d="M40 206L45 211L53 201" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="70" y="204" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0C0407">Systems Lead</text>
    <text x="70" y="218" font-family="Inter, sans-serif" font-size="9.5" fill="#666666">LoomGrid · Seattle</text>
    <text x="32" y="244" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0066FF">$16,500 – $24,000 /mo</text>
    <rect x="32" y="254" width="46" height="14" rx="4" fill="#F7F7F8"/>
    <text x="55" y="264" text-anchor="middle" font-family="Inter, sans-serif" font-size="7.5" fill="#4C4C4C">Hybrid</text>
    <!-- Match bar card -->
    <rect x="20" y="290" width="196" height="72" rx="14" fill="#EEF4FF"/>
    <text x="32" y="314" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#0C0407">Weekly Match Score</text>
    <text x="188" y="314" text-anchor="end" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0066FF">96%</text>
    <rect x="32" y="328" width="172" height="8" rx="4" fill="#DBEAFE"/>
    <rect x="32" y="328" width="154" height="8" rx="4" fill="#0066FF"/>
    <text x="32" y="350" font-family="Inter, sans-serif" font-size="8.5" fill="#4C4C4C">4 hiring teams viewed your portfolio today</text>
  </g>

  <!-- Front Left upright Primary iPhone -->
