<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" fill="none" width="820" height="350">
  <defs>
    <filter id="ctaPhoneShadow" x="0" y="0" width="820" height="350" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0C0407" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="ctaBlueCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Left Phone Tilted -->
  <g transform="translate(88 78) rotate(-14)" filter="url(#ctaPhoneShadow)">
    <rect x="0" y="0" width="210" height="320" rx="32" fill="#0C0407"/>
    <rect x="7" y="7" width="196" height="306" rx="26" fill="#FFFFFF"/>
    <rect x="66" y="14" width="78" height="16" rx="8" fill="#0C0407"/>
    <text x="20" y="54" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0C0407">Saved Roles</text>
    <rect x="18" y="68" width="174" height="72" rx="12" fill="#F7F7F8"/>
    <rect x="28" y="78" width="26" height="26" rx="7" fill="#0066FF"/>
    <text x="62" y="90" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#0C0407">Staff Designer</text>
    <text x="62" y="103" font-family="Inter, sans-serif" font-size="8.5" fill="#666666">$16k – $22k /mo</text>
    <rect x="28" y="114" width="44" height="14" rx="4" fill="#FFFFFF"/>
    <text x="50" y="124" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" fill="#4C4C4C">Remote</text>
    <rect x="18" y="150" width="174" height="72" rx="12" fill="#FFFFFF" stroke="#EAEAEA"/>
    <rect x="28" y="160" width="26" height="26" rx="7" fill="#22C55E"/>
    <text x="62" y="172" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#0C0407">Frontend Architect</text>
    <text x="62" y="185" font-family="Inter, sans-serif" font-size="8.5" fill="#666666">$15k – $20k /mo</text>
    <rect x="18" y="232" width="174" height="60" rx="12" fill="#EEF4FF"/>
    <text x="30" y="256" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#0066FF">2 Active Interviews</text>
    <text x="30" y="272" font-family="Inter, sans-serif" font-size="8" fill="#4C4C4C">Tomorrow · 10:30 AM</text>
  </g>

  <!-- Right Phone Tilted -->
  <g transform="translate(522 26) rotate(14)" filter="url(#ctaPhoneShadow)">
    <rect x="0" y="0" width="210" height="320" rx="32" fill="#0C0407"/>
    <rect x="7" y="7" width="196" height="306" rx="26" fill="#FFFFFF"/>
    <rect x="66" y="14" width="78" height="16" rx="8" fill="#0C0407"/>
    <text x="20" y="54" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0C0407">Offer Tracker</text>
    <rect x="18" y="68" width="174" height="84" rx="12" fill="#EEF4FF" stroke="#BFDBFE"/>
    <text x="30" y="90" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#0066FF">96% Match Readiness</text>
    <text x="30" y="114" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#0C0407">Top 8%</text>
    <rect x="30" y="126" width="150" height="8" rx="4" fill="#DBEAFE"/>
