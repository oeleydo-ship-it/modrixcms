    <text x="56" y="200" font-family="Inter, sans-serif" font-size="8" fill="#666666">Recruiter shared team brief</text>
  </g>

  <!-- Center Hero Upright Phone -->
  <g transform="translate(292 12)" filter="url(#ctaPhoneShadow)">
    <rect x="0" y="0" width="236" height="356" rx="34" fill="#0C0407"/>
    <rect x="8" y="8" width="220" height="340" rx="28" fill="#FFFFFF"/>
    <rect x="78" y="15" width="80" height="18" rx="9" fill="#0C0407"/>
    <text x="24" y="28" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#0C0407">9:41</text>

    <circle cx="38" cy="58" r="13" fill="#DBEAFE"/>
    <text x="58" y="54" font-family="Inter, sans-serif" font-size="8" fill="#666666">Welcome Back</text>
    <text x="58" y="67" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#0C0407">Maya Lin</text>

