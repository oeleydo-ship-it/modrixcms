    <text x="34" y="142" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Apply with one tap</text>
    <text x="34" y="158" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">to vetted roles</text>
    <rect x="34" y="168" width="74" height="20" rx="10" fill="#FFFFFF"/>
    <text x="71" y="181" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="#0066FF">Get Started</text>

    <text x="20" y="224" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#0C0407">Recommendation</text>
    <text x="216" y="224" text-anchor="end" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" fill="#0066FF">See All</text>

    <rect x="20" y="234" width="196" height="92" rx="14" fill="#FFFFFF" stroke="#EAEAEA"/>
    <rect x="32" y="246" width="30" height="30" rx="8" fill="#FEE2E2"/>
    <circle cx="47" cy="261" r="7" fill="#EF4444"/>
    <text x="70" y="257" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#0C0407">UI/UX Designer</text>
    <text x="70" y="270" font-family="Inter, sans-serif" font-size="8.5" fill="#666666">California, United States</text>
    <text x="32" y="294" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#0066FF">$14,000 – $22,000 /mo</text>
    <rect x="32" y="302" width="44" height="14" rx="4" fill="#F7F7F8"/>
    <text x="54" y="312" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" fill="#4C4C4C">Full Time</text>
    <rect x="82" y="302" width="42" height="14" rx="4" fill="#F7F7F8"/>
    <text x="103" y="312" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" fill="#4C4C4C">Remote</text>
